<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Catcher — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; background: #191419; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: "DejaVu Sans", Arial, sans-serif; }
  #wrap { position: relative; width: 1280px; height: 720px; max-width: 100vw; max-height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 12px; background: #120e12; }
  #hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #ffffff99; font-size: 14px; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hint">Move with &larr; &rarr; or your mouse &mdash; catch stars, dodge bombs &mdash; R to restart</div>
</div>
<script>
'use strict';
// Star Catcher: a tiny arcade game. Catch falling stars (+10), dodge bombs (-1 life).
// 3 lives. Every 10 catches the game speeds up a level. Built from one prompt.
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const state = {
  score: 0,
  lives: 3,
  level: 1,
  caught: 0,
  over: false,
  started: false,
  time: 0,
};

const player = { x: W / 2, y: H - 70, w: 150, h: 26, speed: 620, targetX: W / 2 };
let items = [];       // falling {x, y, vy, kind: 'star'|'bomb', r, rot, vr}
let particles = [];   // burst {x, y, vx, vy, life, color, r}
let spawnTimer = 0;
let keys = {};

function rand(a, b) { return a + Math.random() * (b - a); }

function spawnItem() {
  const bombChance = Math.min(0.12 + state.level * 0.03, 0.34);
  const kind = Math.random() < bombChance ? 'bomb' : 'star';
  items.push({
    x: rand(40, W - 40),
    y: -30,
    vy: rand(150, 230) + state.level * 28,
    kind,
    r: kind === 'star' ? 22 : 24,
    rot: rand(0, Math.PI * 2),
    vr: rand(-2, 2),
  });
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(40, 260);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: rand(0.35, 0.7), color, r: rand(3, 7) });
  }
}

function reset() {
  state.score = 0; state.lives = 3; state.level = 1; state.caught = 0;
  state.over = false; state.started = true; state.time = 0;
  items = []; particles = []; spawnTimer = 0;
}

function update(dt) {
  if (!state.started || state.over) return;
  state.time += dt;
  // Player movement: keyboard beats mouse; mouse sets a target.
  if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed * dt;
  if (keys['ArrowRight'] || keys['d']) player.x += player.speed * dt;
  if (!keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['a'] && !keys['d']) {
    player.x += (player.targetX - player.x) * Math.min(1, dt * 14);
  }
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawnItem(); spawnTimer = Math.max(0.28, 0.75 - state.level * 0.05); }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt;
    it.rot += it.vr * dt;
    // Caught by the basket?
    if (it.y + it.r >= player.y - 6 && it.y < player.y + player.h &&
        Math.abs(it.x - player.x) < player.w / 2 + it.r * 0.5) {
      if (it.kind === 'star') {
        state.score += 10; state.caught += 1;
        burst(it.x, it.y, '#ffd34d', 14);
        if (state.caught % 10 === 0) state.level += 1;
      } else {
        state.lives -= 1;
        burst(it.x, it.y, '#ff4d6d', 22);
        if (state.lives <= 0) state.over = true;
      }
      items.splice(i, 1);
      continue;
    }
    if (it.y - it.r > H) items.splice(i, 1); // missed star: no penalty, keep it friendly
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawStar(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#ffd34d';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    ctx[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBomb(x, y, r, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = '#2b2b33';
  ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff4d6d';
  ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.3, r * 0.25, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function draw() {
  // Night sky.
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#241a2e'); g.addColorStop(1, '#120e12');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // Twinkling background stars.
  for (let i = 0; i < 70; i++) {
    const sx = (i * 173) % W, sy = (i * 97) % (H - 140);
    const tw = 0.25 + 0.35 * Math.abs(Math.sin(state.time * 2 + i));
    ctx.fillStyle = `rgba(255,255,255,${tw})`;
    ctx.fillRect(sx, sy, 2, 2);
  }
  // Items.
  for (const it of items) {
    if (it.kind === 'star') drawStar(it.x, it.y, it.r, it.rot);
    else drawBomb(it.x, it.y, it.r, it.rot);
  }
  // Particles.
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.7);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // Basket.
  ctx.fillStyle = '#c41c83';
  ctx.beginPath();
  ctx.roundRect(player.x - player.w / 2, player.y, player.w, player.h, 12);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 15px "DejaVu Sans", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('CATCH', player.x, player.y + 18);

  // HUD: one line at the top so the make.fun badge (top-left, y 96-224) never covers it.
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 34px "DejaVu Sans", Arial, sans-serif';
  ctx.fillText('SCORE  ' + state.score, 28, 52);
  ctx.fillStyle = '#ffd34d';
  ctx.fillText('LEVEL ' + state.level, 330, 52);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff4d6d';
  ctx.fillText('\u2665 '.repeat(state.lives) + '\u2661 '.repeat(Math.max(0, 3 - state.lives)), W - 28, 52);
  ctx.fillStyle = '#ffffff99';
  ctx.font = '20px "DejaVu Sans", Arial, sans-serif';
  ctx.fillText('make.fun', W - 28, 88);

  if (!state.started) {
    ctx.fillStyle = 'rgba(18,14,18,0.72)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 64px "DejaVu Sans", Arial, sans-serif';
    ctx.fillText('STAR CATCHER', W / 2, H / 2 - 30);
    ctx.fillStyle = '#ffd34d';
    ctx.font = 'bold 30px "DejaVu Sans", Arial, sans-serif';
    ctx.fillText('Catch stars. Dodge bombs. 3 lives.', W / 2, H / 2 + 24);
    ctx.fillStyle = '#ffffff';
    ctx.font = '26px "DejaVu Sans", Arial, sans-serif';
    ctx.fillText('Press SPACE or click to play', W / 2, H / 2 + 76);
  }
  if (state.over) {
    ctx.fillStyle = 'rgba(18,14,18,0.78)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff4d6d';
    ctx.font = 'bold 64px "DejaVu Sans", Arial, sans-serif';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 34px "DejaVu Sans", Arial, sans-serif';
    ctx.fillText('Score: ' + state.score + '  ·  Level ' + state.level, W / 2, H / 2 + 28);
    ctx.fillStyle = '#ffd34d';
    ctx.font = '26px "DejaVu Sans", Arial, sans-serif';
    ctx.fillText('Press R to play again', W / 2, H / 2 + 80);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (e.key === ' ' && !state.started) reset();
  if ((e.key === 'r' || e.key === 'R') && state.over) reset();
  if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  player.targetX = (e.clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('click', () => { if (!state.started || state.over) reset(); });
</script>
</body>
</html>
